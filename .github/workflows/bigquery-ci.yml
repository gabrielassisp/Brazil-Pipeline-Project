name: BigQuery local checks
on:
  pull_request:
    paths: ['bigquery/**', '.github/workflows/bigquery-ci.yml']
  push:
    branches: [main]
    paths: ['bigquery/**', '.github/workflows/bigquery-ci.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bigquery
    env:
      BQ_PROJECT: example-project
      BQ_MODE: fixture
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bigquery/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m economic_bq extract --mode fixture
      - run: dbt parse --project-dir dbt --profiles-dir dbt
